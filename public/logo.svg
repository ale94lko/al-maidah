<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Al-Maidah">
  <!--
    Al-Maidah mark: table seen from a standing guest’s angle (oblique),
    not a flat top-down diamond.
  -->
  <defs>
    <linearGradient id="brass" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8d09a"/>
      <stop offset="50%" stop-color="#c6a15b"/>
      <stop offset="100%" stop-color="#8f6f35"/>
    </linearGradient>
    <linearGradient id="tableTop" x1="40" y1="40" x2="90" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#faf7ef"/>
      <stop offset="100%" stop-color="#e7e0d0"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="54" fill="#f4f1e6"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#brass)" stroke-width="6"/>
  <circle cx="64" cy="64" r="42" fill="#1b2740"/>

  <!-- Soft contact shadow under the table -->
  <ellipse cx="66" cy="94" rx="28" ry="5" fill="#0b1220" opacity="0.35"/>

  <!--
    Perspective table: near edge wider, far edge narrower,
    slight yaw so it feels like standing beside it.
  -->
  <path
    d="M28 78 L48 42 L98 38 L108 82 Z"
    fill="url(#tableTop)"
    stroke="#c6a15b"
    stroke-width="2.4"
    stroke-linejoin="round"
  />
  <path
    d="M34 76 L50 46 L94 43 L102 78 Z"
    fill="none"
    stroke="#c6a15b"
    stroke-width="1.2"
    opacity="0.55"
  />

  <!-- Dinner plate (ellipse = foreshortened circle) -->
  <ellipse cx="62" cy="64" rx="16" ry="10" fill="#ffffff" stroke="#1b2740" stroke-width="2"/>
  <ellipse cx="62" cy="64" rx="12" ry="7.2" fill="none" stroke="#c6a15b" stroke-width="1.3"/>

  <!-- Food on plate -->
  <ellipse cx="58" cy="63" rx="5.5" ry="3.4" fill="#e8c56a"/>
  <ellipse cx="58" cy="63" rx="2.2" ry="1.4" fill="#2f9e44"/>
  <path
    d="M64 58c3.5 1 6 3.2 6.5 6"
    fill="none"
    stroke="#e03131"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M52 68c3 1.6 7 2.2 10 1.2"
    fill="none"
    stroke="#2f9e44"
    stroke-width="2"
    stroke-linecap="round"
  />
  <path
    d="M66 69c1.2-2.4 0.6-5-1.4-6.5"
    fill="none"
    stroke="#c6a15b"
    stroke-width="2.1"
    stroke-linecap="round"
  />

  <!-- Drink: upright glass (stays vertical while table is oblique) -->
  <path
    d="M84 48h11l-1.8 22a4.2 4.2 0 0 1-4.2 3.6h-1.2a4.2 4.2 0 0 1-4.2-3.6L84 48z"
    fill="#8ecae6"
    stroke="#1b2740"
    stroke-width="1.7"
    stroke-linejoin="round"
  />
  <path d="M85.4 53h8l-0.8 9h-6.4z" fill="#2f9e44" opacity="0.88"/>
  <ellipse cx="89.5" cy="48" rx="5.8" ry="2.1" fill="#1b2740"/>
  <ellipse cx="89.5" cy="48.6" rx="4.6" ry="1.4" fill="#8ecae6"/>
  <path
    d="M93 44l2.2 16"
    fill="none"
    stroke="#e03131"
    stroke-width="1.6"
    stroke-linecap="round"
  />
</svg>
