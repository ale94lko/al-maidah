<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Al-Maidah">
  <!--
    Al-Maidah: shared table (المائدة) with a clear plate of food and a drink.
    Contents rotate with the diamond table so place settings sit on the sides.
  -->
  <defs>
    <linearGradient id="brass" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8d09a"/>
      <stop offset="50%" stop-color="#c6a15b"/>
      <stop offset="100%" stop-color="#8f6f35"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="54" fill="#f4f1e6"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#brass)" stroke-width="6"/>
  <circle cx="64" cy="64" r="42" fill="#1b2740"/>

  <g transform="rotate(32 64 64)">
    <!-- Table surface -->
    <rect x="38" y="38" width="52" height="52" rx="11" fill="#f4f1e6"/>
    <rect
      x="43"
      y="43"
      width="42"
      height="42"
      rx="9"
      fill="none"
      stroke="#c6a15b"
      stroke-width="2.25"
    />

    <!-- Dinner plate -->
    <circle cx="58" cy="64" r="14" fill="#ffffff" stroke="#1b2740" stroke-width="2"/>
    <circle cx="58" cy="64" r="10.5" fill="none" stroke="#c6a15b" stroke-width="1.4"/>

    <!-- Food on plate: hummus bowl + salad accents + flatbread -->
    <circle cx="56" cy="62" r="5.2" fill="#e8c56a"/>
    <circle cx="56" cy="62" r="2.2" fill="#2f9e44"/>
    <path
      d="M61 57c3 1 5 3 5.5 6"
      fill="none"
      stroke="#e03131"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M51 68c2.5 2 6 3 9 2"
      fill="none"
      stroke="#2f9e44"
      stroke-width="2"
      stroke-linecap="round"
    />
    <path
      d="M63 69c1.5-3 1-6-1-8"
      fill="none"
      stroke="#c6a15b"
      stroke-width="2.2"
      stroke-linecap="round"
    />

    <!-- Drink glass to the right of the plate -->
    <path
      d="M74 52h10l-1.5 18a4 4 0 0 1-4 3.5h-1a4 4 0 0 1-4-3.5L74 52z"
      fill="#8ecae6"
      stroke="#1b2740"
      stroke-width="1.8"
      stroke-linejoin="round"
    />
    <path
      d="M75.2 56h7.4l-0.7 8H75.9z"
      fill="#2f9e44"
      opacity="0.85"
    />
    <rect x="72.5" y="50.5" width="13" height="2.4" rx="1.2" fill="#1b2740"/>
    <!-- Straw -->
    <path
      d="M82 48l2 14"
      fill="none"
      stroke="#e03131"
      stroke-width="1.6"
      stroke-linecap="round"
    />
  </g>
</svg>
