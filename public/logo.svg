<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Al-Maidah">
  <!--
    Al-Maidah: shared table (المائدة) + QR scan-to-order.
    Diamond table top inside a brass-rimmed navy seal.
  -->
  <defs>
    <linearGradient id="brass" x1="18" y1="14" x2="110" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8d09a"/>
      <stop offset="50%" stop-color="#c6a15b"/>
      <stop offset="100%" stop-color="#8f6f35"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="54" fill="#f4f1e6"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="url(#brass)" stroke-width="6"/>
  <circle cx="64" cy="64" r="42" fill="#1b2740"/>

  <!-- Shared square table, diamond orientation -->
  <rect
    x="38"
    y="38"
    width="52"
    height="52"
    rx="11"
    transform="rotate(45 64 64)"
    fill="#f4f1e6"
  />
  <rect
    x="43"
    y="43"
    width="42"
    height="42"
    rx="9"
    transform="rotate(45 64 64)"
    fill="none"
    stroke="#c6a15b"
    stroke-width="2.25"
  />

  <!-- Place setting: plate -->
  <circle cx="58" cy="58" r="7" fill="none" stroke="#1b2740" stroke-width="2.2"/>
  <circle cx="58" cy="58" r="2.4" fill="#2f9e44"/>

  <!-- Utensils -->
  <path d="M69 51v14" fill="none" stroke="#1b2740" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M74 51v14" fill="none" stroke="#1b2740" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Mini QR finder — digital table ordering -->
  <g transform="translate(52 70)">
    <rect width="12" height="12" rx="1.5" fill="none" stroke="#1b2740" stroke-width="2"/>
    <rect x="3.2" y="3.2" width="5.6" height="5.6" rx="0.8" fill="#1b2740"/>
  </g>
  <rect x="68" y="72" width="3" height="3" rx="0.5" fill="#1b2740"/>
  <rect x="73" y="72" width="3" height="3" rx="0.5" fill="#e03131"/>
  <rect x="68" y="77" width="3" height="3" rx="0.5" fill="#1b2740"/>
</svg>
