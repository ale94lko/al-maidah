name: Repo Health Score

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily refresh of the community health badge.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: read-all

jobs:
  generate-badge:
    name: Generate Repo Health Score badge
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and publish badge
        uses: ale94lko/repo-health-score@f1d4dbf4d3af9fbce24166e1a51f1bd49a417434 # main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-readme-badge:
    name: Verify Repo Health Score badge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure README embeds the output badge
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          badge_url="https://raw.githubusercontent.com/${REPO}/output/badge.svg"
          action_url="https://github.com/ale94lko/repo-health-score"
          expected="[![Repo Health](${badge_url})](${action_url})"

          if ! grep -F "${expected}" README.md; then
            echo "README.md is missing the Repo Health Score badge:"
            echo "${expected}"
            exit 1
          fi
          echo "README badge is present"
